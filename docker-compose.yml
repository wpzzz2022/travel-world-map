# 旅行地图 —— 服务器部署
# 阶段一（现在）：纯静态站，单容器 nginx；数据在各人浏览器里（localStorage / IndexedDB）。
# 阶段二（未来）：打开注释里的 api 服务做数据同步，详见 DEPLOY.md。
#
# 启动： docker compose up -d --build
# 更新： git pull && docker compose up -d --build
# 访问： http://<服务器IP>:8080   （HTTPS 反代见 DEPLOY.md）

services:
  web:
    build: .
    image: travel-map:latest
    container_name: travel-map
    ports:
      - "8080:80"
    restart: unless-stopped

  # ---- 阶段二（可选）：轻量数据同步后端，实现后再启用 ----
