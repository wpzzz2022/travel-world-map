<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="我们的旅行计划：转动地球，点亮想去的地方" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🌍%3C/text%3E%3C/svg%3E"
    />
    <title>我们的旅行地图</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // 启动崩溃兜底：React 挂不上时，把错误直接显示出来而不是一片空白
      window.addEventListener("error", function (e) {
        var box = document.getElementById("boot-error");
        if (!box) {
          box = document.createElement("pre");
          box.id = "boot-error";
          box.style.cssText =
            "position:fixed;top:0;left:0;right:0;z-index:99999;margin:0;padding:16px;background:#3b1020;color:#ffd9e0;font:12px/1.6 monospace;white-space:pre-wrap";
          (document.body || document.documentElement).appendChild(box);
        }
        box.textContent += (box.textContent ? "\n\n" : "") + (e.message || "error") + "\n" + (e.filename || "") + ":" + (e.lineno || "");
      });
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
